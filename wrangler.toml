name = "gss-beacon"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# Shared geo store — the SAME database is bound (read-only in practice) by gss-stats.
[[d1_databases]]
binding = "gss_geo"
database_name = "gss-geo"
database_id = "fa0b2929-0086-479e-ae10-50509c34ebf8"

# Live-update ping: the gss-live Worker's `Notify` entrypoint (RPC only). The Worker must exist
# BEFORE this project is deployed — see README "Deploy". Optional at runtime: with no binding the
# beacon behaves exactly as before.
[[services]]
binding = "LIVE"
service = "gss-live"
entrypoint = "Notify"
